<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Pemesanan Bus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h2 class="mb-4">Pemesanan Bus</h2>
  <div class="row">
    <div class="col-md-4">
      <div class="card mb-3"><div class="card-header bg-primary text-white">Detail Bus</div><div class="card-body"><h5>NUGO 1</h5><p>Polisi: AA 7750 OG<br>Kapasitas: 50</p></div></div>
      <div class="card"><div class="card-header bg-primary text-white">Jadwal Tersedia</div><div class="card-body"><div class="alert alert-success mb-0">Tersedia untuk tanggal 25/07/2026</div></div></div>
    </div>
    <div class="col-md-8">
      <div class="card"><div class="card-header bg-primary text-white">Form Pemesanan</div><div class="card-body">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Nama Pemesan</label><input class="form-control" value="Budi Santoso"></div>
          <div class="col-md-6"><label class="form-label">Kontak Pemesan</label><input class="form-control" value="081234567890"></div>
          <div class="col-md-6"><label class="form-label">Kota Asal</label><input class="form-control" value="Magelang"></div>
          <div class="col-md-6"><label class="form-label">Kota Tujuan</label><input class="form-control" value="Jakarta"></div>
          <div class="col-md-6"><label class="form-label">Tanggal Keberangkatan</label><input type="date" class="form-control" value="2026-07-25"></div>
          <div class="col-md-6"><label class="form-label">Waktu Keberangkatan</label><input type="time" class="form-control" value="08:00"></div>
          <div class="col-12"><label class="form-label">Alamat Titik Jemput</label><textarea class="form-control">Jl. Merdeka No. 10, Magelang</textarea></div>
          <div class="col-md-4"><label class="form-label">Jumlah Penumpang</label><input class="form-control" value="45"></div>
          <div class="col-md-4"><label class="form-label">Total Harga</label><input class="form-control" value="Rp 15.000.000"></div>
          <div class="col-md-4"><label class="form-label">Jenis Pembayaran</label><select class="form-select"><option>DP (Uang Muka)</option><option>Lunas</option></select></div>
          <div class="col-md-6"><label class="form-label">Jumlah yang Dibayar</label><input class="form-control" value="Rp 5.000.000"></div>
          <div class="col-md-6"><label class="form-label">Bukti Pembayaran</label><input type="file" class="form-control"></div>
          <div class="col-12"><div class="alert alert-info">Transfer ke BSI 3320221926 a.n. PT NUGO INTL</div></div>
          <div class="col-12"><button class="btn btn-success btn-lg"><i class="fas fa-check"></i> Pesan Sekarang</button></div>
        </div>
      </div></div>
    </div>
  </div>
</div>
</body>
</html>
