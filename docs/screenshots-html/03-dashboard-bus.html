<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Bus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<style>.navbar{background:rgb(33,146,42)!important}.navbar .nav-link{color:#fff!important}</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4"><div class="container"><span class="navbar-brand text-white">Sistem Keuangan</span><span class="nav-link dropdown-toggle">Pemesanan Bus</span><span class="nav-link">nugo@gmail.com</span></div></nav>
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Pemesanan Bus</h2>
    <div>
      <button class="btn btn-info me-2"><i class="fas fa-calendar-alt"></i> Lihat Jadwal Bus</button>
      <button class="btn btn-info"><i class="fas fa-history"></i> Riwayat Pemesanan</button>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="card h-100">
        <img src="https://via.placeholder.com/400x180/007bff/ffffff?text=Bus+NUGO+1" class="card-img-top">
        <div class="card-body">
          <h5>NUGO 1</h5>
          <p class="mb-1"><strong>Polisi:</strong> AA 7750 OG</p>
          <p class="mb-1"><strong>Kapasitas:</strong> 50 penumpang</p>
          <p><strong>Fasilitas:</strong> AC, WiFi, Toilet, TV, Karaoke</p>
          <a href="#" class="btn btn-primary w-100"><i class="fas fa-calendar-check"></i> Lihat Jadwal & Pesan</a>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-4">
      <div class="card h-100">
        <img src="https://via.placeholder.com/400x180/28a745/ffffff?text=Bus+NUGO+2" class="card-img-top">
        <div class="card-body">
          <h5>NUGO 2</h5>
          <p class="mb-1"><strong>Polisi:</strong> AA 7752</p>
          <p class="mb-1"><strong>Kapasitas:</strong> 50 penumpang</p>
          <p><strong>Fasilitas:</strong> AC, WiFi, Toilet, TV, Karaoke</p>
          <a href="#" class="btn btn-primary w-100"><i class="fas fa-calendar-check"></i> Lihat Jadwal & Pesan</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
