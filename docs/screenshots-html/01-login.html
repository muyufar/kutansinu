<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login - Sistem Keuangan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<style>
body{background:#f4f6f8;font-family:Arial,sans-serif}
.login-card{max-width:420px;margin:60px auto;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:32px}
.brand{text-align:center;margin-bottom:24px}
.brand h3{color:#21922a;font-weight:700}
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <i class="fas fa-bus fa-3x text-success mb-3"></i>
    <h3>Sistem Pelaporan Keuangan</h3>
    <p class="text-muted mb-0">Silakan masuk untuk memesan bus</p>
  </div>
  <form>
    <div class="mb-3">
      <label class="form-label">Email atau Username</label>
      <input type="text" class="form-control" value="nugo@gmail.com">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" value="********">
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" checked id="remember">
      <label class="form-check-label" for="remember">Ingat saya</label>
    </div>
    <button type="button" class="btn btn-success w-100"><i class="fas fa-sign-in-alt"></i> Masuk</button>
  </form>
</div>
</body>
</html>
